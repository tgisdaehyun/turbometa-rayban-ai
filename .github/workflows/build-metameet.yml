name: Build MetaMeet
on:
  push:
    branches: ['feat/metameet-transcription', 'feat/metameet-trip-reliability']
    paths: ['MetaMeet/**', '.github/workflows/build-metameet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select recent Xcode
        run: |
          for candidate in Xcode_26.6 Xcode_26.5 Xcode_26.4.1 Xcode_26.4; do
            if [ -d "/Applications/${candidate}.app" ]; then
              sudo xcode-select -s "/Applications/${candidate}.app"
              break
            fi
          done
          xcodebuild -version
      - name: Prepare local key placeholder
        run: |
          touch MetaMeet/EmbeddedGeminiKey.txt
          echo '{}' > MetaMeet/EmbeddedHostConfig.json
      - name: Host transfer tests
        run: python3 -m unittest discover -s MetaMeet/Host/tests -v
      - name: Core tests
        run: swift test --package-path MetaMeet/Core
      - name: Generate project
        run: |
          brew install xcodegen
          cd MetaMeet
          xcodegen generate
      - name: Build simulator
        run: xcodebuild -project MetaMeet/MetaMeet.xcodeproj -scheme MetaMeet -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
      - name: Preview screenshots
        timeout-minutes: 7
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MetaMeet.app
          xcrun simctl launch "$DEVICE" com.rsnav.metameet --preview
          sleep 4
          mkdir -p artifacts
          xcrun simctl io "$DEVICE" screenshot artifacts/MetaMeet-preview.png
          xcrun simctl terminate "$DEVICE" com.rsnav.metameet
          xcrun simctl launch "$DEVICE" com.rsnav.metameet --preview -viewMode bilingual
          sleep 10
          xcrun simctl io "$DEVICE" screenshot artifacts/MetaMeet-bilingual.png
      - name: Build unsigned iPhone app
        run: xcodebuild -project MetaMeet/MetaMeet.xcodeproj -scheme MetaMeet -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-ios CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload artifacts
          cp -R build-ios/Build/Products/Release-iphoneos/MetaMeet.app Payload/
          zip -qry artifacts/MetaMeet.ipa Payload
          shasum -a 256 artifacts/MetaMeet.ipa > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MetaMeet-iOS
          path: artifacts/
          retention-days: 14
