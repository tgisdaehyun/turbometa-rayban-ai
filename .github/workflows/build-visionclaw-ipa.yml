name: Build VisionClaw iOS IPA

on:
  workflow_dispatch:
    inputs:
      meta_app_id:
        description: "Meta Wearables Developer Center App ID (MWDAT/MetaAppID). Not needed when Developer Mode is on in the Meta AI app."
        required: false
        default: ""
      client_token:
        description: "Meta Wearables Developer Center Client Token (MWDAT/ClientToken)."
        required: false
        default: ""
      bundle_id:
        description: "iOS bundle identifier for the build."
        required: false
        default: "com.xiaoanliu.VisionClaw"
  push:
    branches:
      - visionclaw
      - main
    paths-ignore:
      - "**/*.md"
      - "assets/**"
      - "agent/**"
      - "gateway/**"

env:
  PROJECT_DIR: samples/CameraAccess

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Meta DAT SDK 0.4.0+ ships binary xcframeworks whose swiftinterface was
      # emitted by Swift 6.2. Building with an older toolchain (Xcode 16.x,
      # Swift 6.1) links fine but crashes on the first SDK call at runtime.
      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for candidate in Xcode_26.3 Xcode_26.2 Xcode_26.1.1 Xcode_26.0.1; do
            if [ -d "/Applications/${candidate}.app" ]; then
              sudo xcode-select -s "/Applications/${candidate}.app"
              break
            fi
          done
          xcodebuild -version
          swift --version
          SWIFT_VER=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -n 1)
          if [ "$(printf '%s\n6.2\n' "$SWIFT_VER" | sort -V | head -n 1)" != "6.2" ]; then
            echo "::error::Swift $SWIFT_VER is too old for the Meta DAT SDK (needs Swift 6.2+, Xcode 26)."
            exit 1
          fi

      # Secrets.swift is gitignored upstream. Ship placeholders: every value
      # can be entered at runtime in the app's Settings screen.
      - name: Create Secrets.swift
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp CameraAccess/Secrets.swift.example CameraAccess/Secrets.swift

      - name: Resolve Swift Package Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -resolvePackageDependencies \
                     -project CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -derivedDataPath build

      - name: Build VisionClaw (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          META_APP_ID: ${{ github.event.inputs.meta_app_id }}
          CLIENT_TOKEN: ${{ github.event.inputs.client_token }}
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.xiaoanliu.VisionClaw' }}
        run: |
          xcodebuild build \
                     -project CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     DEVELOPMENT_TEAM="" \
                     PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
                     META_APP_ID="$META_APP_ID" \
                     CLIENT_TOKEN="$CLIENT_TOKEN"

      - name: Package App into IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found"
            find build -name "*.app"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :MWDAT" "$APP_PATH/Info.plist" || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "$GITHUB_WORKSPACE/VisionClaw.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/VisionClaw.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS-IPA
          path: VisionClaw.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: visionclaw-build-${{ github.run_number }}
          name: VisionClaw iOS IPA Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Unsigned personal build of VisionClaw (standalone Gemini Live version, commit ${{ github.sha }}).
            Install with Sideloadly or SideStore on iOS 17+, then enter your Gemini API key in Settings.
          files: VisionClaw.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
