name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Meta DAT SDK 0.5.0 ships binary xcframeworks whose swiftinterface was
      # emitted by Swift 6.2.3 (Xcode 26.2+). Compiling the app with an older
      # toolchain (Xcode 16.x = Swift 6.1) still links, but the app and the
      # framework disagree on the ABI of the resilient async/typed-throws
      # protocol methods, and the first call into the SDK
      # (Wearables.shared.startRegistration()) jumps to a garbage address
      # (EXC_BAD_ACCESS / SIGBUS on device). Always build with Swift >= 6.2.
      - name: Select Xcode 26 (Swift 6.2)
        run: |
          for candidate in Xcode_26.3 Xcode_26.2 Xcode_26.1.1 Xcode_26.0.1; do
            if [ -d "/Applications/${candidate}.app" ]; then
              sudo xcode-select -s "/Applications/${candidate}.app"
              break
            fi
          done
          xcodebuild -version
          swift --version
          SWIFT_VER=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -n 1)
          if [ "$(printf '%s\n6.2\n' "$SWIFT_VER" | sort -V | head -n 1)" != "6.2" ]; then
            echo "::error::Swift $SWIFT_VER is too old for Meta DAT SDK 0.5.0 (needs Swift 6.2+, Xcode 26). The build would crash at runtime."
            exit 1
          fi

      - name: Configure Git URL Overrides for SPM
        run: |
          git config --global url."https://github.com/tgisdaehyun/Logboard.git".insteadOf "https://github.com/shogo4405/Logboard.git"

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
                     -project CameraAccess.xcodeproj \
                     -scheme TurboMeta \
                     -derivedDataPath build

      - name: Patch Dependencies (HaishinKit)
        run: |
          echo "=== Patching HaishinKit for iOS VideoToolbox ==="
          find build -name "VTSessionOptionKey.swift" -exec sed -i '' 's/kVTCompressionPropertyKey_VariableBitRate as String/"VariableBitRate"/' {} + || true
          find /Users/runner -name "VTSessionOptionKey.swift" -exec sed -i '' 's/kVTCompressionPropertyKey_VariableBitRate as String/"VariableBitRate"/' {} + 2>/dev/null || true

      - name: Build TurboMeta iOS App
        run: |
          xcodebuild build \
                     -project CameraAccess.xcodeproj \
                     -scheme TurboMeta \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            find build -name "*.app"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r TurboMeta.ipa Payload
          ls -lh TurboMeta.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMeta-iOS-IPA
          path: TurboMeta.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-build-${{ github.run_number }}
          name: TurboMeta iOS IPA Build #${{ github.run_number }}
          body: |
            Automated iOS IPA build for TurboMeta (Ray-Ban Meta AI Assistant).
            Built with GitHub Actions macOS runner.
            Install via Sideloadly or SideStore on iOS 17+.
          files: TurboMeta.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
