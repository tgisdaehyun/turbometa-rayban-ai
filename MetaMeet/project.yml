name: MetaMeet
options:
  bundleIdPrefix: com.rsnav
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MeetingCore:
    path: Core
targets:
  MetaMeet:
    type: application
    platform: iOS
    sources:
      - App
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    dependencies:
      - package: MeetingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsnav.metameet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MetaMeet
        NSMicrophoneUsageDescription: 'Meta 안경 또는 iPhone 마이크로 회의를 녹음하고 한국어로 번역합니다.'
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  MetaMeet:
    build:
      targets:
        MetaMeet: all
