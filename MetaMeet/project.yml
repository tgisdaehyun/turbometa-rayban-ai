name: MetaMeet
options:
  bundleIdPrefix: com.rsnav
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.2.1'
    CURRENT_PROJECT_VERSION: '5'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.8.0
  MeetingCore:
    path: Core
targets:
  MetaMeet:
    type: application
    platform: iOS
    sources:
      - App
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      - WebRTC-LICENSE.txt
      - EmbeddedGeminiKey.txt
      - HostCertificate.der
      - EmbeddedHostConfig.json
      - Core/Tests/MeetingCoreTests/Fixtures/mandarin.wav
    dependencies:
      - package: MeetingCore
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsnav.metameet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MetaMeet.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MetaMeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: 'Tailscale로 연결된 개인 호스트에 회의 원음을 백업하고 연결 상태를 확인합니다.'
        NSMicrophoneUsageDescription: 'Meta 안경 또는 iPhone 마이크로 회의를 녹음하고 한국어로 번역합니다.'
        UIBackgroundModes: [audio, bluetooth-peripheral, external-accessory]
        NSBluetoothAlwaysUsageDescription: 'Meta 안경 연결과 상태 확인에 Bluetooth를 사용합니다.'
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        LSApplicationQueriesSchemes: [fb-viewapp]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.rsnav.metameet
            CFBundleURLSchemes: [metameet]
        MWDAT:
          AppLinkURLScheme: 'metameet://'
          MetaAppID: '0'
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  MetaMeet:
    build:
      targets:
        MetaMeet: all
